[package]
name = "oxideav-flv"
version = "0.0.7"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-flv"
authors = ["Mark Karpeles"]
description = "Pure-Rust Flash Video (FLV) container demuxer and muxer for oxideav"

readme = "README.md"
keywords = ["multimedia", "flv", "flash", "container", "pure-rust"]
categories = ["multimedia::video", "parser-implementations"]

[dependencies]
oxideav-core = "0.1"

[[bench]]
name = "long_file"
harness = false
